# Development overlay: publishes ports on localhost only (never 0.0.0.0).
# Host ports are configurable because dev machines often already run Postgres/Redis/etc.
#
# The backend container runs the built image without --reload: file watching over a
# Windows-mounted (/mnt/c) bind mount polls constantly and burns CPU. For hot reload run the
# backend on the host against these services:
#   cd backend && uv run uvicorn app.main:app --reload --port 8010
services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"]
  redis:
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
  minio:
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
  backend:
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-8010}:8000"]
    # One worker: uvicorn's multi-worker supervisor kills workers that are slow to answer its
    # health ping, which happens constantly on a CPU-starved Docker VM (seen in practice).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
